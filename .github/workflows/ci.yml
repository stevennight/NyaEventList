name: CI

on:
  push:
    branches: ["**"] # 打标签（v*）走 Release 工作流，这里不重复跑
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # 单元测试用到 Node 自带的 node:sqlite，需要 22.13+
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      # Tauri 编译时要求前端产物目录存在，测试不需要真的构建前端，建个空目录即可
      - name: Prepare frontend dist placeholder
        shell: bash
        run: mkdir -p dist
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
